<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Edge Cache</title>
	<link rel="icon" href="/favicon.ico">
	<style>
		body { margin: 0; font-family: "Segoe UI", sans-serif; background: #f3f5f7; color: #1b2836; }
		header { background: #14324a; color: #fff; padding: 16px 28px; font-size: 18px; }
		main { max-width: 680px; margin: 32px auto; padding: 0 20px; }
		.card { background: #fff; border: 1px solid #d5dee6; padding: 20px 22px; }
		h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
		p { margin: 0 0 16px; color: #3d4d5c; }
		dt { color: #6a7b8a; font-size: 13px; }
		dd { margin: 0 0 10px; }
		.ok { color: #1d7a46; }
	</style>
</head>
<body>
	<header>Edge Cache</header>
	<main>
		<div class="card">
			<h1>eu-central</h1>
			<p>Static delivery node.</p>
			<dl>
				<dt>Region</dt>
				<dd>eu-central</dd>
				<dt>Role</dt>
				<dd>edge-cache</dd>
				<dt>Status</dt>
				<dd class="ok">operational</dd>
			</dl>
		</div>
	</main>
</body>
</html>
