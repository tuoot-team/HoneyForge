worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	server_tokens off;

	upstream honeyforge_api {
		server api:8000;
	}

	# Пустой заголовок и отсутствие заголовка для nginx одно и то же.
	map $http_x_agent_token $agent_token_missing {
		default 0;
		""      1;
	}

	# Публичный сайт. Коллектор отвечает только запросу с токеном агента.
	server {
		listen 80;
		server_name _;

		root /usr/share/nginx/html/site;
		index index.html;
		error_page 404 /404.html;

		location = /404.html {
			internal;
		}

		location /downloads/ {
			alias /usr/share/nginx/html/downloads/;
			autoindex off;
		}

		location = /api/v1/pairing/start {
			if ($request_method != POST) {
				return 404;
			}
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location ~ ^/api/v1/pairing/[0-9a-fA-F-]+/complete$ {
			if ($request_method != POST) {
				return 404;
			}
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /api/v1/agent/ {
			if ($agent_token_missing) {
				return 404;
			}
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Agent-Token $http_x_agent_token;
		}

		location = /v1/metrics {
			if ($agent_token_missing) {
				return 404;
			}
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Agent-Token $http_x_agent_token;
		}

		location = /cdn/edge-check {
			if ($agent_token_missing) {
				return 404;
			}
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Agent-Token $http_x_agent_token;
		}

		location = /api/telemetry/batch {
			if ($agent_token_missing) {
				return 404;
			}
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-Agent-Token $http_x_agent_token;
		}

		location / {
			try_files $uri $uri/ =404;
		}
	}

	# Операторский API. Сюда смотрит CLI, не агент.
	server {
		listen 8088;
		server_name _;

		location /api/ {
			proxy_pass http://honeyforge_api;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header Connection "";
			proxy_buffering off;
			proxy_read_timeout 1h;
		}

		location /docs {
			proxy_pass http://honeyforge_api/docs;
			proxy_set_header Host $host;
		}

		location /openapi.json {
			proxy_pass http://honeyforge_api/openapi.json;
			proxy_set_header Host $host;
		}

		location /health {
			proxy_pass http://honeyforge_api/health;
			proxy_set_header Host $host;
		}

		location /downloads/ {
			alias /usr/share/nginx/html/downloads/;
			autoindex off;
		}

		location / {
			return 404;
		}
	}
}
