worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;

	upstream honeyforge_api {
		server api:8000;
	}

	server {
		listen 80;
		server_name _;

		# operator API + часть mimicry (/api/telemetry/batch)
		location /api/ {
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		# mimicry collector (фаза 1)
		location /v1/ {
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /cdn/ {
			proxy_pass http://honeyforge_api;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}

		location /docs {
			proxy_pass http://honeyforge_api/docs;
			proxy_set_header Host $host;
		}

		location /openapi.json {
			proxy_pass http://honeyforge_api/openapi.json;
			proxy_set_header Host $host;
		}

		location /health {
			proxy_pass http://honeyforge_api/health;
			proxy_set_header Host $host;
		}

		location /downloads/ {
			alias /usr/share/nginx/html/downloads/;
			autoindex off;
		}
	}
}
