worker_processes auto;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	server_tokens off;

	upstream honeyforge_api {
		server api:8000;
	}

	# Пустой заголовок и отсутствие заголовка для nginx одно и то же.
	map $http_x_agent_token $agent_token_missing {
		default 0;
		""      1;
	}

	map $http_x_courier_token $courier_token_missing {
		default 0;
		""      1;
	}

	# Публичный канал (HTTP). ACME challenge и опционально тот же трафик без TLS.
	server {
		listen 80;
		server_name _;

		include /etc/nginx/honeyforge/agent_locations.conf;
	}

	# Operator :8088 (HTTP или HTTPS) и agent :443 - пишет entrypoint в conf.d/.
	include /etc/nginx/conf.d/*.conf;
}
