# Общие location публичного канала (агент + витрина). Подключается в server :80 / :443.

root /usr/share/nginx/html/site;
index index.html;
error_page 404 /404.html;

location = /404.html {
	internal;
}

location /.well-known/acme-challenge/ {
	root /var/www/certbot;
}

location /downloads/ {
	alias /usr/share/nginx/html/downloads/;
	autoindex off;
}

location = /api/v1/pairing/start {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/v1/pairing/[0-9a-fA-F-]+/complete$ {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/courier-pairing/start {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/v1/courier-pairing/[0-9a-fA-F-]+/complete$ {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/courier/ {
	if ($courier_token_missing) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Courier-Token $http_x_courier_token;
}

