# Общие location публичного канала (агент + витрина). Подключается в server :80 / :443.

root /usr/share/nginx/html/site;
index index.html;
error_page 404 /404.html;

location = /404.html {
	internal;
}

location /.well-known/acme-challenge/ {
	root /var/www/certbot;
}

location /downloads/ {
	alias /usr/share/nginx/html/downloads/;
	autoindex off;
}

location = /api/v1/pairing/start {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/v1/pairing/[0-9a-fA-F-]+/complete$ {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/courier-pairing/start {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/v1/courier-pairing/[0-9a-fA-F-]+/complete$ {
	if ($request_method != POST) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/v1/courier/ {
	if ($courier_token_missing) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Courier-Token $http_x_courier_token;
}

location /api/v1/agent/ {
	if ($agent_token_missing) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Agent-Token $http_x_agent_token;
}

location = /v1/metrics {
	if ($agent_token_missing) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Agent-Token $http_x_agent_token;
}

location = /cdn/edge-check {
	if ($agent_token_missing) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Agent-Token $http_x_agent_token;
}

location = /api/telemetry/batch {
	if ($agent_token_missing) {
		return 404;
	}
	proxy_pass http://honeyforge_api;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Agent-Token $http_x_agent_token;
}

# Same-origin API панели. Более длинные location агента и курьера забирают свои пути.
location /api/ {
	proxy_pass http://honeyforge_api;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";
	proxy_buffering off;
	proxy_read_timeout 1h;
}

location /assets/ {
	root /usr/share/nginx/html/panel;
	try_files $uri =404;
}

# Панель на :80/:443. Нет собранного dist - остаётся витрина Edge Cache.
location / {
	root /usr/share/nginx/html/panel;
	try_files $uri $uri/ @panel_index;
}

location @panel_index {
	root /usr/share/nginx/html/panel;
	try_files /index.html @cover_site;
}

location @cover_site {
	root /usr/share/nginx/html/site;
	try_files /index.html =404;
}
