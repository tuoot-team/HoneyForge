# Операторский API (CLI / web). Подключается в server :8088 (HTTP или HTTPS).

location /api/ {
	proxy_pass http://honeyforge_api;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Connection "";
	proxy_buffering off;
	proxy_read_timeout 1h;
}

location /docs {
	proxy_pass http://honeyforge_api/docs;
	proxy_set_header Host $host;
}

location /openapi.json {
	proxy_pass http://honeyforge_api/openapi.json;
	proxy_set_header Host $host;
}

location /health {
	proxy_pass http://honeyforge_api/health;
	proxy_set_header Host $host;
}

location /downloads/ {
	alias /usr/share/nginx/html/downloads/;
	autoindex off;
}

location / {
	return 404;
}
