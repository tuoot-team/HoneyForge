# HoneyForge фаза 0 (прикол да?)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-honeyforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-honeyforge}
      POSTGRES_DB: ${POSTGRES_DB:-honeyforge}
    volumes:
      - hf_pg_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_fs_packs.sql:/docker-entrypoint-initdb.d/002_fs_packs.sql:ro
      - ./migrations/003_users_roles.sql:/docker-entrypoint-initdb.d/003_users_roles.sql:ro
      - ./migrations/004_trap_owner.sql:/docker-entrypoint-initdb.d/004_trap_owner.sql:ro
      - ./migrations/005_courier.sql:/docker-entrypoint-initdb.d/005_courier.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-honeyforge} -d ${POSTGRES_DB:-honeyforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      USE_SQLITE: "false"
      FS_PACKS_DIR: /app/fs-packs
    volumes:
      - ./fs-packs:/app/fs-packs
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
      - "8088:8088"
    env_file:
      - .env
    environment:
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      TLS_EMAIL: ${TLS_EMAIL:-}
    volumes:
      - ./nginx/www:/usr/share/nginx/html/site:ro
      - ./downloads:/usr/share/nginx/html/downloads:ro
      - hf_certs:/etc/letsencrypt
      - hf_certbot_www:/var/www/certbot
    depends_on:
      - api

volumes:
  hf_pg_data:
  hf_certs:
  hf_certbot_www:
