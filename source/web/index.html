<!DOCTYPE html>
<html lang="ru" data-theme="graphite">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>HoneyForge</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- Тема до первой отрисовки, иначе графит мигает поверх сохранённого терминала. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem("honeyforge-theme")
					if (stored === "terminal" || stored === "graphite" || stored === "retro") {
						document.documentElement.setAttribute("data-theme", stored)
					}
				} catch {
				}
			})()
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
